name: ci

# Build only: no deploy, no secrets. Runs on every PR and on every push to main.
# There is nothing to compile; the build is "every skill is loadable"
# (scripts/check-skills.sh). Personal repo, so mycelium-cicd's reusable
# workflows (org-only) are not reachable; the step is inline.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-skills.sh

  # L1 check 3: no secrets in the tree. Scans the files as they are now (not history) with
  # gitleaks; findings are printed redacted. A secret that is still in git history needs rotating.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree for committed secrets
        run: |
          rm -rf .git
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir /repo --redact --no-banner --verbose --exit-code 1
